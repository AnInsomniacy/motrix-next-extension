name: Quality Gate
description: Run the repository quality gate with optional browser builds.

inputs:
  working-directory:
    description: Directory that contains the project to verify.
    default: .
  build_chromium:
    description: Run the Chromium production build.
    default: 'false'
  build_firefox:
    description: Run the Firefox production build.
    default: 'false'

runs:
  using: composite
  steps:
    - name: TypeScript compile check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm compile

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm test

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm lint

    - name: i18n lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm lint:i18n

    - name: Format check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm format:check

    - name: Build extension (Chromium)
      if: ${{ inputs.build_chromium == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build

    - name: Build extension (Firefox)
      if: ${{ inputs.build_firefox == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build:firefox
